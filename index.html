<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f4">
<title>Japanese Study Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title" lang="ja">N3 語彙<small>Daily deck</small></h1>
    <div class="acct-wrap"><div class="acct" id="acct"></div><span class="sync" id="sync">Loading progress…</span></div>
  </header>

  <nav id="nav" aria-label="Sections"></nav>

  <section class="ledger" id="ledger" aria-label="Progress"></section>

  <section id="view"></section>

  <footer>N3 word list: <a href="https://github.com/jamsinclair/open-anki-jlpt-decks" rel="noopener">open-anki-jlpt-decks</a> by Jamie Sinclair (MIT licence).</footer>
</div>

<!-- Firebase (Google sign-in + online storage) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  // Turn on online sync only once firebase-config.js has real values in it.
  window.FB_READY = false;
  try{
    if(window.firebase && window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey && !/PASTE/.test(window.FIREBASE_CONFIG.apiKey)){
      firebase.initializeApp(window.FIREBASE_CONFIG);
      firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(()=>{});
      window.FB_READY = true;
    }
  }catch(e){ console.warn("Firebase didn't start:", e); }
</script>
<script src="words.js"></script>
<script src="legacy-v1-keys.js"></script>
<script src="biz-cards.js"></script>
<script src="biz-quiz.js"></script>
<script src="biz-guide.js"></script>
<script src="inv-cards.js"></script>
<script src="inv-quiz.js"></script>
<script src="inv-guide.js"></script>
<script src="app.js"></script>
</body>
</html>
